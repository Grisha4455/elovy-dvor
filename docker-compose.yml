services:
  app:
    build: .
    ports:
      - "4000:4000"
    env_file: apps/api/.env
    environment:
      NODE_ENV: production
      DB_PATH: /data/elovy-dvor.db
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
